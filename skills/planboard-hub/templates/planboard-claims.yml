# Pull request check: the changes must be inside the module the PR's planboard claim holds, made by the claim holder.
# Needs repo variable PLANBOARD_HUB (https://<hub>/b/<board>) and secret PLANBOARD_CI_KEY. Without them it only reports.
# Make "claims" required for main (branch protection / ruleset) to make it binding.
name: planboard claims
on:
  pull_request:
    branches: [main]
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: changes must be inside the claimed module, made by its holder
        env:
          HUB: ${{ vars.PLANBOARD_HUB }}
          CI_KEY: ${{ secrets.PLANBOARD_CI_KEY }}
          BRANCH: ${{ github.head_ref }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: node .github/planboard-check.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
